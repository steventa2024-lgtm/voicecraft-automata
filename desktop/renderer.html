<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ZeroPulse Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b12;
        --panel: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #4ee1c1;
        --text: #e8eef7;
        --muted: #8a97ad;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 28px; background: var(--bg); color: var(--text);
        font: 14px/1.5 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
        background-image: radial-gradient(60% 40% at 50% 0%, rgba(78,225,193,.12), transparent 70%);
      }
      h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
      p.sub { margin: 0 0 20px; color: var(--muted); }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; backdrop-filter: blur(12px); }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .wide { grid-column: 1 / -1; }
      label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
      input {
        width: 100%; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--text);
        background: rgba(0,0,0,.35); border: 1px solid var(--border); outline: none;
      }
      input:focus { border-color: var(--accent); }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
      button {
        height: 38px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--border);
        background: rgba(255,255,255,.06); color: var(--text); font-weight: 600; cursor: pointer;
      }
      button.primary { background: var(--accent); color: #04120e; border-color: transparent; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 8px; }
      .dot.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
      pre {
        margin: 18px 0 0; height: 260px; overflow: auto; padding: 14px; border-radius: 12px;
        background: rgba(0,0,0,.45); border: 1px solid var(--border); color: var(--muted);
        font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>ZeroPulse Companion</h1>
    <p class="sub">Runs the local bridge and drives your Minecraft bot. No Node.js required.</p>

    <div class="panel">
      <div class="grid">
        <div><label>Minecraft host</label><input id="host" value="localhost" /></div>
        <div><label>Port (LAN)</label><input id="port" value="25565" /></div>
        <div><label>Bot username</label><input id="username" value="ZeroPulse" /></div>
        <div><label>Bridge port</label><input id="bridgePort" value="8765" /></div>
        <div><label>Pairing code (control from your phone)</label><input id="pairCode" placeholder="e.g. K7QM24" /></div>
        <div class="wide"><label>ZeroPulse website</label><input id="appUrl" value="https://id-preview--39d2951c-8adb-440f-b598-47437cb660b0.lovable.app" /></div>
      </div>
      <div class="row">
        <button id="start" class="primary">Start bridge</button>
        <button id="stop" disabled>Stop</button>
        <button id="dash">Open dashboard</button>
        <span style="margin-left:auto"><span id="dot" class="dot"></span><span id="state">Stopped</span></span>
      </div>
      <pre id="log">Waiting to start…</pre>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const append = (t) => {
        logEl.textContent = (logEl.textContent + "\n" + t).split("\n").slice(-400).join("\n");
        logEl.scrollTop = logEl.scrollHeight;
      };
      window.companion.onLog(append);
      window.companion.onState((s) => {
        const running = s === "running";
        $("state").textContent = running ? "Running" : "Stopped";
        $("dot").className = "dot" + (running ? " on" : "");
        $("start").disabled = running;
        $("stop").disabled = !running;
      });
      $("start").onclick = () =>
        window.companion.start({
          host: $("host").value.trim(),
          port: Number($("port").value),
          username: $("username").value.trim(),
          bridgePort: Number($("bridgePort").value),
          pairCode: $("pairCode").value.trim().toUpperCase(),
          appUrl: $("appUrl").value.trim(),
        });
      $("stop").onclick = () => window.companion.stop();
      $("dash").onclick = () => window.companion.openDashboard($("appUrl").value.trim());
    </script>
  </body>
</html>
